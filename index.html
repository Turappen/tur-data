<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Toppliste 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFFFFF;
    --ink: #1C1C1C;
    --muted: #8A8A8A;
    --line: #EDEDED;
    --accent: #3F6B4F;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Inter Tight", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 56px 16px 80px; }

  .updated { margin: 0; font-size: 0.875rem; color: var(--muted); }
  h1 {
    margin: 8px 0 48px;
    font-size: clamp(2rem, 7vw, 2.75rem);
    font-weight: 700; letter-spacing: -0.025em; line-height: 1.05;
  }

  .search-box { position: relative; }
  .search-box svg {
    position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    width: 18px; height: 18px; color: #6B6B6B; pointer-events: none;
  }
  .search {
    width: 100%; font: inherit; font-size: 1rem; color: var(--ink);
    padding: 13px 14px 13px 42px;
    background: #F4F4F4; border: 1px solid #D6D6D6; border-radius: 10px;
    -webkit-appearance: none; appearance: none;
  }
  .search::placeholder { color: #6B6B6B; }
  .search:hover { border-color: #BDBDBD; }
  .search:focus { outline: none; background: #FFFFFF; border-color: var(--ink); }
  .search:focus-visible { box-shadow: 0 0 0 3px #DCE7DF; }

  ol { list-style: none; margin: 8px 0 0; padding: 0; }
  li {
    display: grid; grid-template-columns: 2.75rem 1fr auto; align-items: baseline; gap: 12px;
    padding: 14px 0; border-bottom: 1px solid var(--line);
    font-variant-numeric: tabular-nums;
  }
  .rank { color: var(--muted); font-size: 0.9rem; }
  .name { font-weight: 500; overflow-wrap: anywhere; }
  .score { font-weight: 500; }
  li.top .rank { color: var(--accent); font-weight: 700; }
  li.top .name, li.top .score { font-weight: 700; }
  li.top { padding: 18px 0; font-size: 1.15rem; }
  mark { background: #EEF3EF; color: inherit; }

  .msg { display: block; padding: 40px 0; text-align: center; color: var(--muted); border: 0; }
  footer { margin-top: 32px; font-size: 0.8rem; color: var(--muted); }
</style>
</head>
<body>
<main class="wrap">
  <p class="updated" id="updated">Henter liste …</p>
  <h1>Toppliste 2026</h1>

  <div class="search-box">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input class="search" id="search" type="search" placeholder="Søk etter navn" aria-label="Søk etter navn" autocomplete="off">
  </div>

  <ol id="list"></ol>
  <footer id="footer">Oppdateres hver time mellom kl. 09 og 23.</footer>
</main>

<script>
const listEl = document.getElementById('list');
const searchEl = document.getElementById('search');
const fmt = new Intl.NumberFormat('nb-NO');
let entries = [];

function showUpdated(iso) {
  const el = document.getElementById('updated');
  const d = new Date(iso);
  if (isNaN(d)) { el.textContent = ''; return; }
  const now = new Date();
  const time = d.toLocaleTimeString('nb-NO', { hour: '2-digit', minute: '2-digit' });
  const day = d.toDateString() === now.toDateString()
    ? 'i dag'
    : d.toLocaleDateString('nb-NO', { weekday: 'long', day: 'numeric', month: 'long' });
  el.textContent = `Oppdatert ${day} kl. ${time}`;
}

function setName(el, name, q) {
  const i = q ? name.toLowerCase().indexOf(q) : -1;
  if (i < 0) { el.textContent = name; return; }
  const m = document.createElement('mark');
  m.textContent = name.slice(i, i + q.length);
  el.append(name.slice(0, i), m, name.slice(i + q.length));
}

function render() {
  const q = searchEl.value.trim().toLowerCase();
  const rows = q ? entries.filter(e => e.name.toLowerCase().includes(q)) : entries;
  listEl.replaceChildren();
  if (!rows.length) {
    const li = document.createElement('li');
    li.className = 'msg';
    li.textContent = q ? `Ingen navn inneholder «${searchEl.value.trim()}».` : 'Listen er tom.';
    listEl.append(li);
    return;
  }
  const frag = document.createDocumentFragment();
  for (const e of rows) {
    const li = document.createElement('li');
    if (e.rank <= 3) li.className = 'top';
    const r = document.createElement('span'); r.className = 'rank'; r.textContent = e.rank;
    const n = document.createElement('span'); n.className = 'name'; setName(n, e.name, q);
    const s = document.createElement('span'); s.className = 'score'; s.textContent = fmt.format(e.points);
    li.append(r, n, s);
    frag.append(li);
  }
  listEl.append(frag);
}

async function load() {
  try {
    const res = await fetch('toplist.json', { cache: 'no-cache' });
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    entries = (data.entries || []).map(e => ({ ...e, name: String(e.name ?? '').trim() || 'Uten navn' }));
    showUpdated(data.generatedAt);
    render();
  } catch {
    document.getElementById('updated').textContent = 'Kunne ikke hente listen';
    listEl.innerHTML = '<li class="msg">Topplisten kunne ikke lastes. Last inn siden på nytt om litt.</li>';
  }
}

searchEl.addEventListener('input', render);
load();
</script>
</body>
</html>
