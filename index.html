<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Toppliste</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFFFFF;
    --ink: #1C1C1C;
    --muted: #8A8A8A;
    --line: #EDEDED;
    --accent: #3F6B4F;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Inter Tight", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 56px 16px 80px; }

  .updated { margin: 0; font-size: 0.875rem; color: var(--muted); min-height: 1.3em; }
  h1 {
    margin: 8px 0 32px;
    font-size: clamp(2rem, 7vw, 2.75rem);
    font-weight: 700; letter-spacing: -0.025em; line-height: 1.05;
  }

  .tabs { display: flex; gap: 28px; margin: 0 0 20px; border-bottom: 1px solid var(--line); }
  .tab {
    font: inherit; font-size: 1rem; font-weight: 500; color: var(--muted);
    background: none; border: 0; padding: 0 0 12px; margin-bottom: -1px; cursor: pointer;
    border-bottom: 2px solid transparent; white-space: nowrap;
  }
  .tab:hover { color: var(--ink); }
  .tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }
  .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 2px; }
  .tab[hidden] { display: none; }

  .controls { display: grid; gap: 12px; }
  .select-box { position: relative; }
  .select-box[hidden] { display: none; }
  .select-box svg {
    position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
    width: 16px; height: 16px; color: #6B6B6B; pointer-events: none;
  }
  .month-select {
    width: 100%; font: inherit; font-size: 1rem; font-weight: 500; color: var(--ink);
    padding: 13px 42px 13px 14px;
    background: #FFFFFF; border: 1px solid #D6D6D6; border-radius: 10px;
    -webkit-appearance: none; appearance: none; cursor: pointer;
  }
  .month-select:hover { border-color: #BDBDBD; }
  .month-select:focus { outline: none; border-color: var(--ink); }
  .month-select:focus-visible { box-shadow: 0 0 0 3px #DCE7DF; }

  .search-box { position: relative; }
  .search-box svg {
    position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    width: 18px; height: 18px; color: #6B6B6B; pointer-events: none;
  }
  .search {
    width: 100%; font: inherit; font-size: 1rem; color: var(--ink);
    padding: 13px 14px 13px 42px;
    background: #F4F4F4; border: 1px solid #D6D6D6; border-radius: 10px;
    -webkit-appearance: none; appearance: none;
  }
  .search::placeholder { color: #6B6B6B; }
  .search:hover { border-color: #BDBDBD; }
  .search:focus { outline: none; background: #FFFFFF; border-color: var(--ink); }
  .search:focus-visible { box-shadow: 0 0 0 3px #DCE7DF; }

  ol { list-style: none; margin: 8px 0 0; padding: 0; }
  li {
    display: grid; grid-template-columns: 2.75rem 1fr auto; align-items: baseline; gap: 12px;
    padding: 14px 0; border-bottom: 1px solid var(--line);
    font-variant-numeric: tabular-nums;
  }
  .rank { color: var(--muted); font-size: 0.9rem; }
  .name { font-weight: 500; overflow-wrap: anywhere; }
  .score { font-weight: 500; }
  li.top .rank { color: var(--accent); font-weight: 700; }
  li.top .name, li.top .score { font-weight: 700; }
  li.top { padding: 18px 0; font-size: 1.15rem; }
  mark { background: #EEF3EF; color: inherit; }

  .msg { display: block; padding: 40px 0; text-align: center; color: var(--muted); border: 0; }
  footer { margin-top: 32px; font-size: 0.8rem; color: var(--muted); }
</style>
</head>
<body>
<main class="wrap">
  <p class="updated" id="updated">Henter liste …</p>
  <h1>Toppliste</h1>

  <div class="tabs" role="tablist" aria-label="Velg periode">
    <button class="tab" role="tab" id="tab-year" data-view="year" aria-selected="true">2026</button>
    <button class="tab" role="tab" id="tab-month" data-view="month" aria-selected="false">Denne måneden</button>
    <button class="tab" role="tab" id="tab-archive" data-view="archive" aria-selected="false" hidden>Tidligere måneder</button>
  </div>

  <div class="controls">
    <div class="select-box" id="select-box" hidden>
      <select class="month-select" id="month-select" aria-label="Velg måned"></select>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
    </div>
    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input class="search" id="search" type="search" placeholder="Søk etter navn eller kommune" aria-label="Søk etter navn eller kommune" autocomplete="off">
    </div>
  </div>

  <ol id="list" role="tabpanel"></ol>
  <footer id="footer"></footer>
</main>

<script>
const listEl = document.getElementById('list');
const searchEl = document.getElementById('search');
const updatedEl = document.getElementById('updated');
const footerEl = document.getElementById('footer');
const selectBox = document.getElementById('select-box');
const selectEl = document.getElementById('month-select');
const archiveTab = document.getElementById('tab-archive');
const tabs = [...document.querySelectorAll('.tab')];
const fmt = new Intl.NumberFormat('nb-NO');

// Én post per liste, nøkkelen er filnavnet
const cache = {};   // fil -> { data, error, loading }
let view = 'year';
let archiveField = null;

try {
  const saved = localStorage.getItem('view');
  if (saved === 'month' || saved === 'archive') view = saved;
  archiveField = localStorage.getItem('archiveMonth');
} catch {}

function fileFor(v) {
  if (v === 'year') return 'toplist.json';
  if (v === 'month') return 'monthlist.json';
  return archiveField ? `months/${archiveField}.json` : null;
}

// "September2026" → { name: "September", year: "2026" }
function splitField(field) {
  const m = String(field || '').match(/^(\D+)(\d{4})$/);
  return m ? { name: m[1], year: m[2] } : { name: String(field || ''), year: '' };
}

function updatedText(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return '';
  const now = new Date();
  const time = d.toLocaleTimeString('nb-NO', { hour: '2-digit', minute: '2-digit' });
  const day = d.toDateString() === now.toDateString()
    ? 'i dag'
    : d.toLocaleDateString('nb-NO', { day: 'numeric', month: 'long', year: 'numeric' });
  return `Oppdatert ${day} kl. ${time}`;
}

function setName(el, name, q) {
  const i = q ? name.toLowerCase().indexOf(q) : -1;
  if (i < 0) { el.textContent = name; return; }
  const m = document.createElement('mark');
  m.textContent = name.slice(i, i + q.length);
  el.append(name.slice(0, i), m, name.slice(i + q.length));
}

function message(text) {
  const li = document.createElement('li');
  li.className = 'msg';
  li.textContent = text;
  listEl.replaceChildren(li);
}

async function fetchList(file) {
  if (cache[file]) return;
  cache[file] = { loading: true };
  try {
    const res = await fetch(file, { cache: 'no-cache' });
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    data.entries = (data.entries || []).map(e => {
      const name = String(e.name ?? '').trim() || 'Uten navn';
      const kommune = String(e.kommune ?? '').trim();
      return { ...e, label: kommune ? `${name}, ${kommune}` : name };
    });
    cache[file] = { data };
    if (file === 'monthlist.json') document.getElementById('tab-month').textContent = splitField(data.month).name || 'Denne måneden';
    if (file === 'toplist.json') {
      const y = new Date(data.generatedAt).getFullYear();
      if (!isNaN(y)) document.getElementById('tab-year').textContent = String(y);
    }
  } catch {
    cache[file] = { error: true };
  }
  if (fileFor(view) === file) render();
}

function render() {
  tabs.forEach(t => t.setAttribute('aria-selected', String(t.dataset.view === view)));
  listEl.setAttribute('aria-labelledby', 'tab-' + view);
  selectBox.hidden = view !== 'archive';
  footerEl.textContent = view === 'archive'
    ? 'Sluttresultat for valgt måned.'
    : 'Oppdateres hver halvtime mellom kl. 09 og 24.';

  const file = fileFor(view);
  if (!file) { updatedEl.textContent = ''; message('Ingen tidligere måneder er lagret ennå.'); return; }

  const entry = cache[file];
  if (!entry || entry.loading) { updatedEl.textContent = 'Henter liste …'; message('Henter liste …'); fetchList(file); return; }
  if (entry.error) { updatedEl.textContent = 'Kunne ikke hente listen'; message('Listen kunne ikke lastes. Last inn siden på nytt om litt.'); return; }

  const data = entry.data;
  updatedEl.textContent = view === 'archive'
    ? `${splitField(data.month).name} ${splitField(data.month).year}`
    : updatedText(data.generatedAt);

  const q = searchEl.value.trim().toLowerCase();
  const rows = q ? data.entries.filter(e => e.label.toLowerCase().includes(q)) : data.entries;

  if (!rows.length) {
    if (q) message(`Ingen navn eller kommuner inneholder «${searchEl.value.trim()}».`);
    else if (view === 'year') message('Listen er tom.');
    else message('Ingen fikk poeng denne måneden.');
    return;
  }

  const frag = document.createDocumentFragment();
  for (const e of rows) {
    const li = document.createElement('li');
    if (e.rank <= 3) li.className = 'top';
    const r = document.createElement('span'); r.className = 'rank'; r.textContent = e.rank;
    const n = document.createElement('span'); n.className = 'name'; setName(n, e.label, q);
    const s = document.createElement('span'); s.className = 'score'; s.textContent = fmt.format(e.points);
    li.append(r, n, s);
    frag.append(li);
  }
  listEl.replaceChildren(frag);
}

async function loadArchiveIndex() {
  try {
    const res = await fetch('months/index.json', { cache: 'no-cache' });
    if (!res.ok) throw new Error(res.status);
    const months = ((await res.json()).months || []).slice().reverse();   // nyeste først
    if (!months.length) throw new Error('tom');
    for (const f of months) {
      const { name, year } = splitField(f);
      const opt = document.createElement('option');
      opt.value = f;
      opt.textContent = `${name} ${year}`.trim();
      selectEl.append(opt);
    }
    if (!months.includes(archiveField)) archiveField = months[0];
    selectEl.value = archiveField;
    archiveTab.hidden = false;
  } catch {
    archiveField = null;
    archiveTab.hidden = true;
    if (view === 'archive') view = 'year';
  }
  render();
}

function choose(v) {
  view = v;
  try { localStorage.setItem('view', v); } catch {}
  render();
}

tabs.forEach(t => t.addEventListener('click', () => choose(t.dataset.view)));
tabs.forEach(t => t.addEventListener('keydown', e => {
  if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
  const visible = tabs.filter(x => !x.hidden);
  const i = visible.indexOf(t);
  const next = visible[(i + (e.key === 'ArrowRight' ? 1 : visible.length - 1)) % visible.length];
  next.focus(); next.click();
}));
selectEl.addEventListener('change', () => {
  archiveField = selectEl.value;
  try { localStorage.setItem('archiveMonth', archiveField); } catch {}
  render();
});
searchEl.addEventListener('input', render);

render();
fetchList('toplist.json');
fetchList('monthlist.json');
loadArchiveIndex();
</script>
</body>
</html>
