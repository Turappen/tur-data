<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>TUR-Lister</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFFFFF;
    --ink: #1C1C1C;
    --muted: #8A8A8A;
    --line: #EDEDED;
    --accent: #3F6B4F;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Inter Tight", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 56px 16px 80px; }

  .updated { margin: 0; font-size: 0.875rem; color: var(--muted); min-height: 1.3em; }
  h1 {
    margin: 8px 0 32px;
    font-size: clamp(2rem, 7vw, 2.75rem);
    font-weight: 700; letter-spacing: -0.025em; line-height: 1.05;
  }

  .tabs {
    display: flex; gap: 22px; margin: 0 0 20px; border-bottom: 1px solid var(--line);
    overflow-x: auto; scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs.more-right { -webkit-mask-image: linear-gradient(to right, #000 85%, transparent); mask-image: linear-gradient(to right, #000 85%, transparent); }
  .tabs.more-left { -webkit-mask-image: linear-gradient(to left, #000 85%, transparent); mask-image: linear-gradient(to left, #000 85%, transparent); }
  .tabs.more-left.more-right { -webkit-mask-image: linear-gradient(to right, transparent, #000 15%, #000 85%, transparent); mask-image: linear-gradient(to right, transparent, #000 15%, #000 85%, transparent); }
  .sub { display: block; margin-top: 2px; font-size: 0.8rem; font-weight: 400; color: var(--muted); }
  .tab {
    font: inherit; font-size: 1rem; font-weight: 500; color: var(--muted);
    background: none; border: 0; padding: 0 0 12px; margin-bottom: -1px; cursor: pointer;
    border-bottom: 2px solid transparent; white-space: nowrap;
  }
  .tab:hover { color: var(--ink); }
  .tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }
  .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 2px; }
  .tab[hidden] { display: none; }

  .controls { display: grid; gap: 12px; }
  .select-box { position: relative; }
  .select-box[hidden] { display: none; }
  .select-box svg {
    position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
    width: 16px; height: 16px; color: #6B6B6B; pointer-events: none;
  }
  .month-select {
    width: 100%; font: inherit; font-size: 1rem; font-weight: 500; color: var(--ink);
    padding: 13px 42px 13px 14px;
    background: #FFFFFF; border: 1px solid #D6D6D6; border-radius: 10px;
    -webkit-appearance: none; appearance: none; cursor: pointer;
  }
  .month-select:hover { border-color: #BDBDBD; }
  .month-select:focus { outline: none; border-color: var(--ink); }
  .month-select:focus-visible { box-shadow: 0 0 0 3px #DCE7DF; }

  .search-box { position: relative; }
  .search-box svg {
    position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    width: 18px; height: 18px; color: #6B6B6B; pointer-events: none;
  }
  .search {
    width: 100%; font: inherit; font-size: 1rem; color: var(--ink);
    padding: 13px 14px 13px 42px;
    background: #F4F4F4; border: 1px solid #D6D6D6; border-radius: 10px;
    -webkit-appearance: none; appearance: none;
  }
  .search::placeholder { color: #6B6B6B; }
  .search:hover { border-color: #BDBDBD; }
  .search:focus { outline: none; background: #FFFFFF; border-color: var(--ink); }
  .search:focus-visible { box-shadow: 0 0 0 3px #DCE7DF; }

  ol { list-style: none; margin: 8px 0 0; padding: 0; }
  li {
    display: grid; grid-template-columns: 2.75rem 1fr auto; align-items: baseline; gap: 12px;
    padding: 14px 0; border-bottom: 1px solid var(--line);
    font-variant-numeric: tabular-nums;
  }
  .rank { color: var(--muted); font-size: 0.9rem; }
  .name { font-weight: 500; overflow-wrap: anywhere; }
  .score { font-weight: 500; }
  li.top .rank { color: var(--accent); font-weight: 700; }
  li.top .name, li.top .score { font-weight: 700; }
  li.top { padding: 18px 0; font-size: 1.15rem; }
  li.visit { display: block; padding: 14px 0; }
  .line1 { display: block; font-weight: 500; overflow-wrap: anywhere; }
  .line2 { display: block; margin-top: 3px; font-size: 0.9rem; color: var(--muted); overflow-wrap: anywhere; }
  mark { background: #EEF3EF; color: inherit; }

  .msg { display: block; padding: 40px 0; text-align: center; color: var(--muted); border: 0; }
  .summary { margin: 20px 0 4px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .summary[hidden] { display: none; }
  .chart { position: relative; margin: 16px 0 8px; padding-top: 22px; }
  .chart[hidden] { display: none; }
  .max-label { position: absolute; top: 0; left: 0; font-size: 0.75rem; color: var(--muted); }
  .bars { display: flex; align-items: flex-end; gap: 2px; height: 160px; border-bottom: 1px solid #D6D6D6; }
  .col { flex: 1; height: 100%; display: flex; align-items: flex-end; cursor: pointer; outline: none; }
  .bar { width: 100%; background: var(--accent); border-radius: 4px 4px 0 0; }
  .col.active .bar, .col:hover .bar { background: #2C4D38; }
  .col:focus-visible { box-shadow: inset 0 0 0 2px #DCE7DF; }
  .axis { position: relative; height: 20px; font-size: 0.75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .axis span { position: absolute; top: 4px; transform: translateX(-50%); }
  .tip { position: absolute; top: -6px; padding: 6px 10px; background: var(--ink); color: #FFFFFF; font-size: 0.8rem; border-radius: 6px; white-space: nowrap; pointer-events: none; }
  .tip[hidden] { display: none; }
  li.day-row { grid-template-columns: 1fr auto; padding: 10px 0; }
  li.day-row .name { font-weight: 400; }
  .summary-note { display: block; margin-top: 2px; font-size: 0.85rem; font-weight: 400; color: var(--muted); }
  footer { margin-top: 32px; font-size: 0.8rem; color: var(--muted); }
</style>
</head>
<body>
<main class="wrap">
  <p class="updated" id="updated">Henter liste …</p>
  <h1 id="title">TUR-Lister</h1>

  <div class="tabs" role="tablist" aria-label="Velg liste">
    <button class="tab" role="tab" id="tab-year" data-view="year" aria-selected="true">2026</button>
    <button class="tab" role="tab" id="tab-month" data-view="month" aria-selected="false">Denne måneden</button>
    <button class="tab" role="tab" id="tab-fylker" data-view="fylker" aria-selected="false" hidden>Område</button>
    <button class="tab" role="tab" id="tab-visits" data-view="visits" aria-selected="false">Dagens besøk</button>
    <button class="tab" role="tab" id="tab-daily" data-view="daily" aria-selected="false" hidden>Besøk per dag</button>
    <button class="tab" role="tab" id="tab-archive" data-view="archive" aria-selected="false" hidden>Tidligere</button>
    <button class="tab" role="tab" id="tab-alltime" data-view="alltime" aria-selected="false" hidden>Adelskalender</button>
    <button class="tab" role="tab" id="tab-poster" data-view="poster" aria-selected="false" hidden>Poster</button>
  </div>

  <div class="controls">
    <div class="select-box" id="select-box" hidden>
      <select class="month-select" id="month-select" aria-label="Velg måned"></select>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
    </div>
    <div class="select-box" id="fylke-box" hidden>
      <select class="month-select" id="fylke-select" aria-label="Velg område"></select>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
    </div>
    <div class="select-box" id="daily-box" hidden>
      <select class="month-select" id="daily-select" aria-label="Velg måned"></select>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
    </div>
    <div class="search-box" id="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input class="search" id="search" type="search" placeholder="Søk etter navn eller kommune" aria-label="Søk etter navn eller kommune" autocomplete="off">
    </div>
  </div>

  <p class="summary" id="summary" hidden></p>
  <div class="chart" id="chart" hidden></div>
  <ol id="list" role="tabpanel"></ol>
  <footer id="footer"></footer>
</main>

<script>
const listEl = document.getElementById('list');
const searchEl = document.getElementById('search');
const updatedEl = document.getElementById('updated');
const titleEl = document.getElementById('title');
const summaryEl = document.getElementById('summary');
const footerEl = document.getElementById('footer');
const selectBox = document.getElementById('select-box');
const selectEl = document.getElementById('month-select');
const archiveTab = document.getElementById('tab-archive');
const fylkeBox = document.getElementById('fylke-box');
const fylkeSelect = document.getElementById('fylke-select');
const fylkeTab = document.getElementById('tab-fylker');
const alltimeTab = document.getElementById('tab-alltime');
const ALLTIME_FILE = 'alltime/alltime.json';
const posterTab = document.getElementById('tab-poster');
const POSTER_FILE = 'poster/poster.json';
const FYLKE_FILE = 'fylker/fylker.json';
const dailyTab = document.getElementById('tab-daily');
const dailyBox = document.getElementById('daily-box');
const dailySelect = document.getElementById('daily-select');
const chartEl = document.getElementById('chart');
const searchBox = document.getElementById('search-box');
const tabs = [...document.querySelectorAll('.tab')];
const fmt = new Intl.NumberFormat('nb-NO');

// Én post per liste, nøkkelen er filnavnet
const cache = {};   // fil -> { data, error, loading }
let view = 'year';
let archiveField = null;
let fylke = null;
let dailyMonth = null;   // f.eks. "November2026"

try {
  const saved = localStorage.getItem('view');
  if (['month', 'archive', 'visits', 'daily', 'fylker', 'alltime', 'poster'].includes(saved)) view = saved;
  dailyMonth = localStorage.getItem('dailyMonth');
  archiveField = localStorage.getItem('archiveMonth');
  fylke = localStorage.getItem('fylke');
} catch {}

function prepareEntries(list) {
  return (list || []).map(e => {
    const name = String(e.name ?? '').trim() || 'Uten navn';
    const kommune = String(e.kommune ?? '').trim();
    return { ...e, label: kommune ? `${name}, ${kommune}` : name };
  });
}

function fileFor(v) {
  if (v === 'year') return 'toplist.json';
  if (v === 'month') return 'monthlist.json';
  if (v === 'visits') return 'visits.json';
  if (v === 'fylker') return FYLKE_FILE;
  if (v === 'alltime') return ALLTIME_FILE;
  if (v === 'poster') return POSTER_FILE;
  if (v === 'daily') return dailyMonth ? `besok/Visits${dailyMonth}.json` : null;
  return archiveField ? `months/${archiveField}.json` : null;
}

// "September2026" → { name: "September", year: "2026" }
function splitField(field) {
  const m = String(field || '').match(/^(\D+)(\d{4})$/);
  return m ? { name: m[1], year: m[2] } : { name: String(field || ''), year: '' };
}

function updatedText(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return '';
  const now = new Date();
  const time = d.toLocaleTimeString('nb-NO', { hour: '2-digit', minute: '2-digit' });
  const day = d.toDateString() === now.toDateString()
    ? 'i dag'
    : d.toLocaleDateString('nb-NO', { day: 'numeric', month: 'long', year: 'numeric' });
  return `Oppdatert ${day} kl. ${time}`;
}

function setName(el, name, q) {
  const i = q ? name.toLowerCase().indexOf(q) : -1;
  if (i < 0) { el.textContent = name; return; }
  const m = document.createElement('mark');
  m.textContent = name.slice(i, i + q.length);
  el.append(name.slice(0, i), m, name.slice(i + q.length));
}

function message(text) {
  const li = document.createElement('li');
  li.className = 'msg';
  li.textContent = text;
  listEl.replaceChildren(li);
}

function fetchList(file) {
  if (cache[file]) return cache[file].promise;
  const promise = loadFile(file);
  cache[file] = { loading: true, promise };
  return promise;
}

async function loadFile(file) {
  try {
    const res = await fetch(file, { cache: 'no-cache' });
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    if (file === 'visits.json') {
      data.entries = (data.visits || []).map(v => {
        const place = [v.ControlDescription, v.Kommune, v.Fylke]
          .map(x => String(x ?? '').trim()).filter(Boolean).join(', ') || 'Ukjent kontrollpunkt';
        const user = String(v.visitUser ?? '').trim() || 'Ukjent bruker';
        return { line1: place, line2: user, label: `${place} ${user}` };
      });
    } else if (file.startsWith('besok/')) {
      data.days = (data.days || []).filter(d => d && d.date).map(d => ({ date: d.date, visits: Number(d.visits) || 0 }));
      data.entries = [];
    } else if (file === POSTER_FILE) {
      data.entries = (data.entries || []).map(p => {
        const main = String(p.ControlDescription ?? '').trim() || 'Ukjent post';
        const sub = [p.Kommune, p.Fylke].map(x => String(x ?? '').trim()).filter(Boolean).join(', ');
        return { rank: p.rank, points: p.visits, label: main, sub, search: `${main} ${sub}` };
      });
    } else if (file === FYLKE_FILE) {
      data.byName = {};
      data.names = [];
      for (const f of data.fylker || []) {
        const n = String(f.fylke ?? '').trim();
        if (!n) continue;
        data.names.push(n);
        data.byName[n] = prepareEntries(f.entries);
      }
    } else {
      data.entries = prepareEntries(data.entries);
    }
    cache[file] = { data };
    if (file === 'monthlist.json') document.getElementById('tab-month').textContent = splitField(data.month).name || 'Denne måneden';
    if (file === 'toplist.json') {
      const y = data.year || new Date(data.generatedAt).getFullYear();
      if (y && !Number.isNaN(Number(y))) document.getElementById('tab-year').textContent = String(y);
    }
  } catch {
    cache[file] = { error: true };
  }
  if (fileFor(view) === file) render();
}

function render() {
  tabs.forEach(t => t.setAttribute('aria-selected', String(t.dataset.view === view)));
  const activeTab = tabs.find(t => t.dataset.view === view);
  if (activeTab && !activeTab.hidden) {
    // Ruller bare fanelinjen sidelengs, aldri hele siden
    const left = activeTab.offsetLeft - tabsEl.offsetLeft;
    tabsEl.scrollLeft = left - (tabsEl.clientWidth - activeTab.offsetWidth) / 2;   // midtstiller valgt fane
  }
  updateTabFade();
  const posterData = cache[POSTER_FILE] && cache[POSTER_FILE].data;
  titleEl.textContent = view === 'poster'
    ? `Mest besøkte poster ${posterData && posterData.year ? posterData.year : ''}`.trim()
    : 'TUR-Lister';
  listEl.setAttribute('aria-labelledby', 'tab-' + view);
  selectBox.hidden = view !== 'archive';
  fylkeBox.hidden = view !== 'fylker';
  dailyBox.hidden = view !== 'daily';
  searchBox.hidden = view === 'daily';
  chartEl.hidden = true;
  summaryEl.hidden = true;
  footerEl.textContent = view === 'archive'
    ? 'Sluttresultat for valgt måned.'
    : view === 'fylker'
      ? 'Områdelistene oppdateres hver natt.'
      : view === 'alltime'
        ? alltimeFooter()
        : view === 'poster'
          ? posterFooter()
          : view === 'daily'
            ? 'Oppdateres hver natt. Alle besøk telles, også fra brukere som har reservert seg.'
            : 'Oppdateres jevnlig mellom kl. 09 og 24.';

  const file = fileFor(view);
  if (!file) { updatedEl.textContent = ''; message(view === 'daily' ? 'Ingen måneder er talt opp ennå.' : 'Ingen tidligere måneder er lagret ennå.'); return; }

  const entry = cache[file];
  if (!entry || entry.loading) { updatedEl.textContent = 'Henter liste …'; message('Henter liste …'); fetchList(file); return; }
  if (entry.error) { updatedEl.textContent = 'Kunne ikke hente listen'; message('Listen kunne ikke lastes. Last inn siden på nytt om litt.'); return; }

  const data = entry.data;
  updatedEl.textContent = view === 'archive'
    ? `${splitField(data.month).name} ${splitField(data.month).year}`
    : updatedText(data.generatedAt);

  if (view === 'daily') { renderDaily(data); return; }

  if (view === 'visits') {
    const count = Number.isFinite(data.totalCount) ? data.totalCount
      : Number.isFinite(data.count) ? data.count : data.entries.length;
    summaryEl.textContent = `Antall postbesøk i dag: ${fmt.format(count)}`;
    const note = document.createElement('span');
    note.className = 'summary-note';
    note.textContent = 'Brukere som har reservert seg vises ikke i listen';
    summaryEl.append(note);
    summaryEl.hidden = false;
  }

  const all = view === 'fylker' ? (data.byName[fylke] || []) : data.entries;
  const q = searchEl.value.trim().toLowerCase();
  const rows = q ? all.filter(e => (e.search || e.label).toLowerCase().includes(q)) : all;

  if (!rows.length) {
    if (q) message(view === 'visits' || view === 'poster'
      ? `Ingen ${view === 'poster' ? 'poster' : 'besøk'} passer med «${searchEl.value.trim()}».`
      : `Ingen navn eller kommuner inneholder «${searchEl.value.trim()}».`);
    else if (view === 'year') message('Listen er tom.');
    else if (view === 'visits') message('Ingen besøk er registrert i dag ennå.');
    else if (view === 'fylker') message(`Ingen i ${fylke || 'dette området'} har poeng ennå.`);
    else if (view === 'alltime') message('Adelskalenderen er tom.');
    else if (view === 'poster') message('Ingen besøk er registrert ennå.');
    else message('Ingen fikk poeng denne måneden.');
    return;
  }

  const frag = document.createDocumentFragment();
  if (view === 'visits') {
    for (const v of rows) {
      const li = document.createElement('li'); li.className = 'visit';
      const a = document.createElement('span'); a.className = 'line1'; setName(a, v.line1, q);
      const b = document.createElement('span'); b.className = 'line2'; setName(b, v.line2, q);
      li.append(a, b);
      frag.append(li);
    }
    listEl.replaceChildren(frag);
    return;
  }
  for (const e of rows) {
    const li = document.createElement('li');
    if (e.rank <= 3) li.className = 'top';
    const r = document.createElement('span'); r.className = 'rank'; r.textContent = e.rank;
    const n = document.createElement('span'); n.className = 'name'; setName(n, e.label, q);
    if (view === 'alltime' && e.years) {
      const count = Object.keys(e.years).length;
      const sub = document.createElement('span'); sub.className = 'sub';
      sub.textContent = `Poeng i ${count} av ${yearSpan()} år`;
      n.append(sub);
    }
    if (view === 'poster' && e.sub) {
      const sub = document.createElement('span'); sub.className = 'sub';
      setName(sub, e.sub, q);
      n.append(sub);
    }
    const s = document.createElement('span'); s.className = 'score'; s.textContent = fmt.format(e.points);
    li.append(r, n, s);
    frag.append(li);
  }
  listEl.replaceChildren(frag);
}

async function loadArchiveIndex() {
  try {
    const res = await fetch('months/index.json', { cache: 'no-cache' });
    if (!res.ok) throw new Error(res.status);
    const months = ((await res.json()).months || []).slice().reverse();   // nyeste først
    if (!months.length) throw new Error('tom');
    for (const f of months) {
      const { name, year } = splitField(f);
      const opt = document.createElement('option');
      opt.value = f;
      opt.textContent = `${name} ${year}`.trim();
      selectEl.append(opt);
    }
    if (!months.includes(archiveField)) archiveField = months[0];
    selectEl.value = archiveField;
    archiveTab.hidden = false;
  } catch {
    archiveField = null;
    archiveTab.hidden = true;
    if (view === 'archive') view = 'year';
  }
  render();
}

async function loadFylker() {
  await fetchList(FYLKE_FILE);
  const entry = cache[FYLKE_FILE];
  const names = entry && entry.data ? entry.data.names : [];
  if (!names.length) {
    fylkeTab.hidden = true;
    if (view === 'fylker') view = 'year';
    render();
    return;
  }
  for (const n of names) {
    const opt = document.createElement('option');
    opt.value = n;
    opt.textContent = n;
    fylkeSelect.append(opt);
  }
  if (!names.includes(fylke)) fylke = names[0];
  fylkeSelect.value = fylke;
  fylkeTab.hidden = false;
  render();
}

function yearSpan() {
  const d = cache[ALLTIME_FILE] && cache[ALLTIME_FILE].data;
  if (!d) return '';
  return Number(d.toYear) - Number(d.fromYear) + 1;
}

function alltimeFooter() {
  const d = cache[ALLTIME_FILE] && cache[ALLTIME_FILE].data;
  if (!d) return '';
  const total = d.totalUsers ? ` ${fmt.format(d.totalUsers)} brukere har poeng totalt.` : '';
  return `Summen av alle poeng fra ${d.fromYear} til ${d.toYear}.${total}`;
}

function posterFooter() {
  const d = cache[POSTER_FILE] && cache[POSTER_FILE].data;
  if (!d) return '';
  const totals = d.totalVisits
    ? ` ${fmt.format(d.totalVisits)} besøk totalt på ${fmt.format(d.totalControls || 0)} poster.`
    : '';
  return `Antall besøk per post i ${d.year}.${totals}`;
}

// "2026-11-27" → Date (midt på dagen i UTC, så datoen aldri forskyves)
function dayDate(iso) { return new Date(`${iso}T12:00:00Z`); }
function dayLong(iso) {
  const t = dayDate(iso).toLocaleDateString('nb-NO', { timeZone: 'UTC', weekday: 'long', day: 'numeric', month: 'long' });
  return t.charAt(0).toUpperCase() + t.slice(1);
}
function monthLabel(field) {
  const { name, year } = splitField(field);
  return `${name.toLowerCase()} ${year}`.trim();
}

function renderDaily(data) {
  const days = data.days;
  const total = Number.isFinite(data.total) ? data.total : days.reduce((a, d) => a + d.visits, 0);
  summaryEl.textContent = `Besøk i ${monthLabel(data.month)}: ${fmt.format(total)}`;
  if (days.length) {
    const note = document.createElement('span');
    note.className = 'summary-note';
    note.textContent = `I snitt ${fmt.format(Math.round(total / days.length))} per dag`;
    summaryEl.append(note);
  }
  summaryEl.hidden = false;

  if (!days.length) { message('Ingen dager er talt opp ennå.'); return; }

  // Søylediagram: én søyle per dag
  const max = Math.max(1, ...days.map(d => d.visits));
  const bars = document.createElement('div');
  bars.className = 'bars';
  const tip = document.createElement('div');
  tip.className = 'tip';
  tip.hidden = true;
  const showTip = (col, d) => {
    tip.textContent = `${dayLong(d.date)}: ${fmt.format(d.visits)} besøk`;
    tip.hidden = false;
    const cw = chartEl.clientWidth, tw = tip.offsetWidth;
    const x = col.offsetLeft + col.offsetWidth / 2;
    tip.style.left = Math.max(0, Math.min(cw - tw, x - tw / 2)) + 'px';
    bars.querySelectorAll('.col').forEach(c => c.classList.toggle('active', c === col));
  };
  const hideTip = () => { tip.hidden = true; bars.querySelectorAll('.col.active').forEach(c => c.classList.remove('active')); };

  days.forEach(d => {
    const col = document.createElement('div');
    col.className = 'col';
    col.tabIndex = 0;
    col.setAttribute('aria-label', `${dayLong(d.date)}: ${d.visits} besøk`);
    const bar = document.createElement('div');
    bar.className = 'bar';
    bar.style.height = d.visits ? Math.max(2, d.visits / max * 100) + '%' : '0';
    col.append(bar);
    col.addEventListener('pointerenter', () => showTip(col, d));
    col.addEventListener('click', () => showTip(col, d));
    col.addEventListener('focus', () => showTip(col, d));
    col.addEventListener('blur', hideTip);
    bars.append(col);
  });
  bars.addEventListener('pointerleave', hideTip);

  // Akse med dagnummer: 1, 5, 10, 15 … og siste dag
  const axis = document.createElement('div');
  axis.className = 'axis';
  days.forEach((d, i) => {
    const n = Number(d.date.slice(8, 10));
    const last = i === days.length - 1;
    const tooClose = last && n % 5 !== 0 && n % 5 < 3;   // unngå at f.eks. 25 og 26 kolliderer
    if (n === 1 || n % 5 === 0 || (last && !tooClose)) {
      const t = document.createElement('span');
      t.textContent = n;
      t.style.left = ((i + 0.5) / days.length * 100) + '%';
      axis.append(t);
    }
  });

  const maxLabel = document.createElement('div');
  maxLabel.className = 'max-label';
  maxLabel.textContent = `Høyeste: ${fmt.format(max)}`;

  chartEl.replaceChildren(maxLabel, bars, axis, tip);
  chartEl.hidden = false;

  // Tabell: nyeste dag først
  const frag = document.createDocumentFragment();
  [...days].reverse().forEach(d => {
    const li = document.createElement('li');
    li.className = 'day-row';
    const n = document.createElement('span'); n.className = 'name'; n.textContent = dayLong(d.date);
    const s = document.createElement('span'); s.className = 'score'; s.textContent = fmt.format(d.visits);
    li.append(n, s);
    frag.append(li);
  });
  listEl.replaceChildren(frag);
}

// Leser oversikten over hvilke måneder som er talt opp
async function loadDaily() {
  let months = [];
  try {
    const res = await fetch('besok/index.json', { cache: 'no-cache' });
    if (res.ok) months = ((await res.json()).months || []).slice().reverse();   // nyeste først
  } catch {}
  if (!months.length) {
    dailyTab.hidden = true;
    dailyMonth = null;
    if (view === 'daily') view = 'year';
    render();
    return;
  }
  for (const f of months) {
    const opt = document.createElement('option');
    opt.value = f;
    const { name, year } = splitField(f);
    opt.textContent = `${name} ${year}`;
    dailySelect.append(opt);
  }
  if (!months.includes(dailyMonth)) dailyMonth = months[0];
  dailySelect.value = dailyMonth;
  dailyTab.hidden = false;
  render();
}

async function loadPoster() {
  await fetchList(POSTER_FILE);
  const entry = cache[POSTER_FILE];
  const ok = entry && entry.data && entry.data.entries.length;
  posterTab.hidden = !ok;
  if (!ok && view === 'poster') view = 'year';
  render();
}

async function loadAlltime() {
  await fetchList(ALLTIME_FILE);
  const entry = cache[ALLTIME_FILE];
  const ok = entry && entry.data && entry.data.entries.length;
  alltimeTab.hidden = !ok;
  if (!ok && view === 'alltime') view = 'year';
  render();
}

// Viser en svak toning til høyre når det finnes flere faner utenfor skjermen
const tabsEl = document.querySelector('.tabs');
function updateTabFade() {
  const more = tabsEl.scrollLeft + tabsEl.clientWidth < tabsEl.scrollWidth - 2;
  const less = tabsEl.scrollLeft > 2;
  tabsEl.classList.toggle('more-right', more);
  tabsEl.classList.toggle('more-left', less);
}
tabsEl.addEventListener('scroll', updateTabFade, { passive: true });
window.addEventListener('resize', updateTabFade);

function choose(v) {
  view = v;
  try { localStorage.setItem('view', v); } catch {}
  render();
}

tabs.forEach(t => t.addEventListener('click', () => choose(t.dataset.view)));
tabs.forEach(t => t.addEventListener('keydown', e => {
  if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
  const visible = tabs.filter(x => !x.hidden);
  const i = visible.indexOf(t);
  const next = visible[(i + (e.key === 'ArrowRight' ? 1 : visible.length - 1)) % visible.length];
  next.focus(); next.click();
}));
selectEl.addEventListener('change', () => {
  archiveField = selectEl.value;
  try { localStorage.setItem('archiveMonth', archiveField); } catch {}
  render();
});
fylkeSelect.addEventListener('change', () => {
  fylke = fylkeSelect.value;
  try { localStorage.setItem('fylke', fylke); } catch {}
  render();
});
dailySelect.addEventListener('change', () => {
  dailyMonth = dailySelect.value;
  try { localStorage.setItem('dailyMonth', dailyMonth); } catch {}
  render();
});
searchEl.addEventListener('input', render);

render();
fetchList('toplist.json');
fetchList('monthlist.json');
loadArchiveIndex();
loadFylker();
loadAlltime();
loadPoster();
loadDaily();
</script>
