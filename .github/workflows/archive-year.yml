name: Lag månedsarkiv for et helt år

on:
  workflow_dispatch:      # kjøres bare manuelt
    inputs:
      year:
        description: 'Hvilket år skal hentes? (f.eks. 2025, 2024, 2023)'
        required: true
        default: '2025'   # endre her for å bytte standardår

permissions:
  contents: write         # for å lagre filene i repoet
  actions: write          # for å starte publiseringen etterpå

concurrency:
  group: archive          # unngår at to arkivjobber lagrer samtidig
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    env:
      YEAR: ${{ inputs.year }}
    steps:
      - uses: actions/checkout@v6

      - name: Sjekk årstallet
        shell: bash
        run: |
          if ! [[ "$YEAR" =~ ^[0-9]{4}$ ]]; then
            echo "Ugyldig år: '$YEAR'. Skriv fire sifre, f.eks. 2025."
            exit 1
          fi
          echo "Henter alle måneder i $YEAR"

      - name: Hent topplister for alle 12 måneder
        shell: bash
        run: |
          set -euo pipefail
          MONTHS=(Januar Februar Mars April Mai Juni Juli August September Oktober November Desember)
          mkdir -p months

          for M in "${MONTHS[@]}"; do
            FIELD="${M}${YEAR}"
            echo "Henter $FIELD"

            curl -sf -G "https://parseapi.back4app.com/users" \
              -H "X-Parse-Application-Id: ${{ secrets.B4A_APP_ID }}" \
              -H "X-Parse-REST-API-Key: ${{ secrets.B4A_REST_KEY }}" \
              --data-urlencode "where={\"$FIELD\":{\"\$gt\":0}}" \
              --data-urlencode "order=-$FIELD" \
              --data-urlencode 'limit=200' \
              --data-urlencode "keys=username,kommune,$FIELD" \
              | jq -c --arg f "$FIELD" '
                  .results as $r
                  | {
                      month: $f,
                      generatedAt: (now | todateiso8601),
                      entries: [
                        $r[] | .[$f] as $p
                        | {
                            rank: ([$r[] | select(.[$f] > $p)] | length + 1),
                            name: (.username | gsub("^\\s+|\\s+$"; "")),
                            kommune: ((.kommune // "") | tostring | gsub("^\\s+|\\s+$"; "")),
                            points: $p
                          }
                      ]
                    }' \
              > "months/$FIELD.json"
          done

      - name: Oppdater oversikten over måneder
        shell: bash
        run: |
          set -euo pipefail
          MONTHS=(Januar Februar Mars April Mai Juni Juli August September Oktober November Desember)
          # Lister alle månedsfiler som finnes, sortert etter år og måned
          for f in months/*.json; do
            NAME=$(basename "$f" .json)
            [ "$NAME" = "index" ] && continue
            [[ "$NAME" =~ ^([^0-9]+)([0-9]{4})$ ]] || continue
            for i in "${!MONTHS[@]}"; do
              if [ "${MONTHS[$i]}" = "${BASH_REMATCH[1]}" ]; then
                printf '%s %02d %s\n' "${BASH_REMATCH[2]}" "$((i+1))" "$NAME"
              fi
            done
          done | sort | awk '{print $3}' | jq -R . | jq -sc '{months: .}' > months/index.json
          cat months/index.json

      - name: Lagre filene i repoet
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add months
          if git diff --cached --quiet; then
            echo "Ingen endringer"
          else
            git commit -m "Månedsarkiv for $YEAR"
            git pull --rebase
            git push
          fi

      - name: Publiser siden på nytt
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run export.yml --ref main
